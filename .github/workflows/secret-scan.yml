name: Secretos

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (contenedor oficial, sin licencia de org)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --redact --verbose
